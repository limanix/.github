name: Feature request
description: Describe a use case or a limitation you would like addressed.
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case
      description: What are you trying to do, and what prevents it today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Existing approaches or workarounds you have considered.
