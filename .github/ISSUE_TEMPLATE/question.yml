name: Question
description: Ask about usage, configuration, or development.
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Remove credentials and private data from examples and logs.
        For vulnerabilities, follow the [security policy](https://github.com/limanix/.github/blob/main/SECURITY.md).
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to understand or accomplish?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Relevant versions, configuration, documentation, and what you have tried.
