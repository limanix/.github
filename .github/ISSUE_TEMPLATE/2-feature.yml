name: "Feature request"
description: "Suggest a new capability or improve an existing one"
type: "Feature"
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: "What are you trying to do that is hard or impossible today?"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: "Describe the behavior you want. A configuration or command example is welcome."
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: "Describe current workarounds or other approaches you considered."
